<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">repo-governance check JSON example</title>
  <desc id="desc">A terminal card showing a successful check where an auth risk zone raises the requested small engineering profile to high and requires broad verification.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c2f"/>
      <stop offset="1" stop-color="#08262f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020617" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1278" height="718" rx="28" fill="#07111f" stroke="#173b5f" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="64" y="54" width="1152" height="612" rx="22" fill="url(#frame)" stroke="#244665" stroke-width="2"/>
    <rect x="64" y="54" width="1152" height="58" rx="22" fill="#142238"/>
    <rect x="64" y="90" width="1152" height="22" fill="#142238"/>
    <circle cx="98" cy="83" r="7" fill="#fb7185"/>
    <circle cx="122" cy="83" r="7" fill="#fbbf24"/>
    <circle cx="146" cy="83" r="7" fill="#4ade80"/>
    <text x="640" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">repo-governance · stable JSON contract</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="104" y="158" fill="#5eead4">$</text>
    <text x="128" y="158" fill="#f8fafc">repo-governance check --base main --json</text>

    <text x="104" y="206" fill="#94a3b8">{</text>
    <text x="132" y="238" fill="#7dd3fc">&quot;ok&quot;</text><text x="182" y="238" fill="#94a3b8">:</text><text x="198" y="238" fill="#86efac">true</text><text x="244" y="238" fill="#94a3b8">,</text>
    <text x="132" y="270" fill="#7dd3fc">&quot;governanceDecision&quot;</text><text x="372" y="270" fill="#94a3b8">:</text><text x="390" y="270" fill="#fde68a">&quot;satisfied&quot;</text><text x="520" y="270" fill="#94a3b8">,</text>

    <text x="132" y="302" fill="#7dd3fc">&quot;engineeringProfile&quot;</text><text x="362" y="302" fill="#94a3b8">: {</text>
    <text x="164" y="334" fill="#7dd3fc">&quot;requested&quot;</text><text x="292" y="334" fill="#94a3b8">:</text><text x="310" y="334" fill="#fde68a">&quot;small&quot;</text><text x="390" y="334" fill="#94a3b8">,</text>
    <text x="164" y="366" fill="#7dd3fc">&quot;effective&quot;</text><text x="292" y="366" fill="#94a3b8">:</text><text x="310" y="366" fill="#f0abfc">&quot;high&quot;</text><text x="378" y="366" fill="#94a3b8">,</text>
    <text x="164" y="398" fill="#7dd3fc">&quot;raisedBy&quot;</text><text x="282" y="398" fill="#94a3b8">: [</text><text x="310" y="398" fill="#fde68a">&quot;riskZone:auth&quot;</text><text x="486" y="398" fill="#94a3b8">]</text>
    <text x="132" y="430" fill="#94a3b8">},</text>

    <text x="132" y="462" fill="#7dd3fc">&quot;verificationAdvice&quot;</text><text x="362" y="462" fill="#94a3b8">: {</text>
    <text x="164" y="494" fill="#7dd3fc">&quot;profile&quot;</text><text x="260" y="494" fill="#94a3b8">:</text><text x="278" y="494" fill="#f0abfc">&quot;high&quot;</text><text x="346" y="494" fill="#94a3b8">,</text>
    <text x="164" y="526" fill="#7dd3fc">&quot;requiredLevel&quot;</text><text x="332" y="526" fill="#94a3b8">:</text><text x="350" y="526" fill="#fde68a">&quot;broad&quot;</text><text x="430" y="526" fill="#94a3b8">,</text>
    <text x="164" y="558" fill="#7dd3fc">&quot;fullSuiteRequired&quot;</text><text x="390" y="558" fill="#94a3b8">:</text><text x="408" y="558" fill="#86efac">false</text>
    <text x="132" y="590" fill="#94a3b8">},</text>
    <text x="132" y="622" fill="#7dd3fc">&quot;stopAdvice&quot;</text><text x="270" y="622" fill="#94a3b8">: {</text><text x="302" y="622" fill="#7dd3fc">&quot;action&quot;</text><text x="390" y="622" fill="#94a3b8">:</text><text x="408" y="622" fill="#fde68a">&quot;stop-if-objective-satisfied&quot;</text><text x="738" y="622" fill="#94a3b8"> }</text>
    <text x="104" y="650" fill="#94a3b8">}</text>
  </g>

  <g transform="translate(760 208)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="388" height="310" rx="20" fill="#0b1628" stroke="#274761"/>
    <text x="28" y="44" fill="#94a3b8" font-size="13" font-weight="750" letter-spacing="1.5">WHAT THE REPORT SAYS</text>
    <circle cx="35" cy="88" r="9" fill="#4ade80" fill-opacity=".18" stroke="#4ade80"/>
    <path d="M31 88L34 91L40 84" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="94" fill="#f8fafc" font-size="17" font-weight="680">No blocking finding</text>
    <circle cx="35" cy="137" r="9" fill="#c084fc" fill-opacity=".18" stroke="#c084fc"/>
    <path d="M35 131V143M29 137H41" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="143" fill="#f8fafc" font-size="17" font-weight="680">Auth raises the profile</text>
    <circle cx="35" cy="186" r="9" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/>
    <path d="M35 180V187M35 192V193" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="58" y="192" fill="#f8fafc" font-size="17" font-weight="680">Broad verification is the floor</text>
    <line x1="28" y1="222" x2="360" y2="222" stroke="#24425c"/>
    <text x="28" y="254" fill="#67e8f9" font-size="14" font-weight="720">IMPORTANT BOUNDARY</text>
    <text x="28" y="280" fill="#94a3b8" font-size="14">“satisfied” is a governance result.</text>
    <text x="28" y="302" fill="#94a3b8" font-size="14">It does not prove the objective is done.</text>
  </g>
</svg>
