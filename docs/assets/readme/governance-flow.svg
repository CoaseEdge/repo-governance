<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Repository governance flow</title>
  <desc id="desc">A six-stage flow from read-only preflight and explicit task contracts through implementation, deterministic checks, isolated offline pre-push verification, and exact-revision CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".52" stop-color="#0e1b31"/>
      <stop offset="1" stop-color="#06262d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1598" height="558" rx="28" fill="url(#bg)" stroke="#173b5f" stroke-width="2"/>
  <text x="72" y="74" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="750">From intent to evidence—without changing the rule source</text>
  <text x="72" y="110" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Each gate has one job. Every hard decision comes from the same version-pinned engine.</text>

  <path d="M170 270H1430" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(54 164)">
      <rect width="222" height="226" rx="22" fill="#101c2f" stroke="#234a73" stroke-width="2"/>
      <circle cx="34" cy="34" r="17" fill="#1d4ed8"/><text x="34" y="40" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">1</text>
      <text x="24" y="88" fill="#60a5fa" font-size="13" font-weight="750" letter-spacing="1.6">READ-ONLY GATE</text>
      <text x="24" y="120" fill="#f8fafc" font-size="22" font-weight="740">Preflight</text>
      <text x="24" y="153" fill="#94a3b8" font-size="15">managed?</text>
      <text x="24" y="177" fill="#94a3b8" font-size="15">engine aligned?</text>
      <rect x="24" y="194" width="112" height="22" rx="11" fill="#172554"/><text x="80" y="210" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700">NO WRITES</text>
    </g>

    <g transform="translate(308 164)">
      <rect width="222" height="226" rx="22" fill="#101c2f" stroke="#234a73" stroke-width="2"/>
      <circle cx="34" cy="34" r="17" fill="#2563eb"/><text x="34" y="40" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">2</text>
      <text x="24" y="88" fill="#60a5fa" font-size="13" font-weight="750" letter-spacing="1.6">DECLARE</text>
      <text x="24" y="120" fill="#f8fafc" font-size="22" font-weight="740">Task Contract</text>
      <text x="24" y="153" fill="#94a3b8" font-size="15">paths + categories</text>
      <text x="24" y="177" fill="#94a3b8" font-size="15">budgets + profile</text>
      <rect x="24" y="194" width="128" height="22" rx="11" fill="#172554"/><text x="88" y="210" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="700">EXPLICIT POLICY</text>
    </g>

    <g transform="translate(562 164)">
      <rect width="222" height="226" rx="22" fill="#101c2f" stroke="#27516b" stroke-width="2"/>
      <circle cx="34" cy="34" r="17" fill="#0891b2"/><text x="34" y="40" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">3</text>
      <text x="24" y="88" fill="#67e8f9" font-size="13" font-weight="750" letter-spacing="1.6">CHANGE</text>
      <text x="24" y="120" fill="#f8fafc" font-size="22" font-weight="740">Source + tests</text>
      <text x="24" y="153" fill="#94a3b8" font-size="15">human or Agent</text>
      <text x="24" y="177" fill="#94a3b8" font-size="15">reviewable diff</text>
      <rect x="24" y="194" width="116" height="22" rx="11" fill="#0c3543"/><text x="82" y="210" text-anchor="middle" fill="#a5f3fc" font-size="11" font-weight="700">IN SCOPE</text>
    </g>

    <g transform="translate(816 164)">
      <rect width="222" height="226" rx="22" fill="#101c2f" stroke="#27516b" stroke-width="2"/>
      <circle cx="34" cy="34" r="17" fill="#0891b2"/><text x="34" y="40" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">4</text>
      <text x="24" y="88" fill="#67e8f9" font-size="13" font-weight="750" letter-spacing="1.6">VERIFY</text>
      <text x="24" y="120" fill="#f8fafc" font-size="22" font-weight="740">Check + tests</text>
      <text x="24" y="153" fill="#94a3b8" font-size="15">RG001—RG009</text>
      <text x="24" y="177" fill="#94a3b8" font-size="15">current-diff evidence</text>
      <rect x="24" y="194" width="130" height="22" rx="11" fill="#0c3543"/><text x="89" y="210" text-anchor="middle" fill="#a5f3fc" font-size="11" font-weight="700">STABLE JSON</text>
    </g>

    <g transform="translate(1070 164)">
      <rect width="222" height="226" rx="22" fill="#101c2f" stroke="#256050" stroke-width="2"/>
      <circle cx="34" cy="34" r="17" fill="#0d9488"/><text x="34" y="40" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">5</text>
      <text x="24" y="88" fill="#5eead4" font-size="13" font-weight="750" letter-spacing="1.6">PUSH GATE</text>
      <text x="24" y="120" fill="#f8fafc" font-size="22" font-weight="740">Pre-push</text>
      <text x="24" y="153" fill="#94a3b8" font-size="15">candidate engine</text>
      <text x="24" y="177" fill="#94a3b8" font-size="15">detached local clone</text>
      <rect x="24" y="194" width="112" height="22" rx="11" fill="#0d3535"/><text x="80" y="210" text-anchor="middle" fill="#99f6e4" font-size="11" font-weight="700">OFFLINE</text>
    </g>

    <g transform="translate(1324 164)">
      <rect width="222" height="226" rx="22" fill="#101c2f" stroke="#256050" stroke-width="2"/>
      <circle cx="34" cy="34" r="17" fill="#0f766e"/><text x="34" y="40" text-anchor="middle" fill="#fff" font-size="16" font-weight="750">6</text>
      <text x="24" y="88" fill="#5eead4" font-size="13" font-weight="750" letter-spacing="1.6">REVIEW</text>
      <text x="24" y="120" fill="#f8fafc" font-size="22" font-weight="740">PR + CI</text>
      <text x="24" y="153" fill="#94a3b8" font-size="15">clean committed diff</text>
      <text x="24" y="177" fill="#94a3b8" font-size="15">exact event revision</text>
      <rect x="24" y="194" width="128" height="22" rx="11" fill="#0d3535"/><text x="88" y="210" text-anchor="middle" fill="#99f6e4" font-size="11" font-weight="700">SAME ENGINE</text>
    </g>
  </g>

  <g fill="#38bdf8">
    <path d="M286 270L298 263V277Z"/>
    <path d="M540 270L552 263V277Z"/>
    <path d="M794 270L806 263V277Z"/>
    <path d="M1048 270L1060 263V277Z"/>
    <path d="M1302 270L1314 263V277Z"/>
  </g>

  <g transform="translate(330 450)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="940" height="62" rx="31" fill="#0b2434" stroke="#1e5a70"/>
    <circle cx="38" cy="31" r="11" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee"/>
    <path d="M33 31L37 35L44 27" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="27" fill="#f8fafc" font-size="16" font-weight="720">One version-pinned engine across every gate</text>
    <text x="64" y="47" fill="#94a3b8" font-size="13">No fallback policy · no LLM enforcement · no hidden network path</text>
  </g>
</svg>
